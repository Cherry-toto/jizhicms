<!DOCTYPE html>
<html>
    
    <head>
       <meta charset="UTF-8">
        {include="style"}
		{include="edit"}
		
    </head>
    
    <body>
	 <div class="x-nav">
            <span class="layui-breadcrumb">
              <a><cite>{fun JZLANG('首页')}</cite></a>
              <a><cite>{fun JZLANG('扩展管理')}</cite></a>
             
			 <a><cite>{fun JZLANG('修改轮播图')}</cite></a>
            </span>
            <a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right"  href="javascript:location.replace(location.href);" title="{fun JZLANG('刷新')}"><i class="iconfont" style="line-height:30px">&#xe6aa;</i></a>
        </div>
        <div class="x-body">
            <form class="layui-form layui-form-pane" >
			<input type="hidden" name="go" value="1" />
			<input type="hidden" name="id" value="{$data['id']}" />
			
			<div class="layui-tab">
			  <ul class="layui-tab-title">
				<li class="layui-this">{fun JZLANG('基本')}</li>
				<li>{fun JZLANG('扩展')}</li>
				
			  </ul>
			  <div class="layui-tab-content">
				<div class="layui-tab-item layui-show">
				 <div class="layui-form-item">
                    <label for="title" class="layui-form-label">
                        <span class="x-red">*</span>{fun JZLANG('标题')}
                    </label>
                    <div class="layui-input-inline">
                        <input type="text" id="title" value="{$data['title']}" style="width:500px;"  name="title" required="" lay-verify="required"
                        autocomplete="off" class="layui-input">
                    </div>
                </div>
				<div class="layui-form-item">
                    <label for="tid" class="layui-form-label">
                        <span class="x-red">*</span>{fun JZLANG('所属分类')}
                    </label>
                    <div class="layui-input-inline">
						<select name="tid" id="tid" lay-search="" >
						<option value="0">{fun JZLANG('选择分类')}</option>
					   {foreach $collect_type as $v}
					   <option {if($data['tid']==$v['id'])} selected="selected" {/if}  value="{$v['id']}">{$v['name']}</option>
					   {/foreach}
					   </select>
                    </div>
                </div>
				
				
				<div class="layui-form-item layui-form-text">
                        <label for="description" class="layui-form-label">
                            <span class="x-red"></span>{fun JZLANG('简介')}
                        </label>
                        <div class="layui-input-block">
                            <textarea  name="description" class="layui-textarea">{$data['description']}</textarea>
                        </div>
                </div>
				<div class="layui-form-item">
                    <label for="litpic" class="layui-form-label">
						<span class="x-red">*</span>{fun JZLANG('图片')}
                    </label>
                    
					<div class="layui-input-inline">
						<input name="litpic" placeholder="{fun JZLANG('上传图片')}" type="text" class="layui-input" id="litpic"  value="{$data['litpic']}" />
					</div>
					<div class="layui-input-inline">
						<button class="layui-btn layui-btn-primary" id="litpic_upload" type="button" >{fun JZLANG('选择图片')}</button>
					</div>
					<div class="layui-input-inline">
						<button class="layui-btn layui-btn-warm" id="litpic_gallery" type="button" >{fun JZLANG('图库')}</button>
					</div>
					<div class="layui-input-inline">
						<img id="litpic_img" class="img-responsive img-thumbnail" style="max-width: 200px;" src="{$data['litpic']}" onerror="javascipt:this.src='{__Tpl_style__}/style/images/nopic.jpg'; this.title='{fun JZLANG('图片未找到')}';this.onerror=''">
						<button type="button" onclick="deleteImage(this)" class="layui-btn layui-btn-sm layui-btn-radius layui-btn-danger " title="{fun JZLANG('删除这张图片')}" >{fun JZLANG('删除')}</button>
					</div>
                </div>
				
				<div class="layui-form-item">
                    <label for="h" class="layui-form-label">
                        <span class="x-red"></span>{fun JZLANG('图片高')}
                    </label>
                    <div class="layui-input-inline">
                        <input type="text"  placeholder="{fun JZLANG('0表示不限制')}" value="{$data['h']}" style="width:500px;" name="h"
                        autocomplete="off" class="layui-input">
                    </div>
                </div>
				<div class="layui-form-item">
                    <label for="w" class="layui-form-label">
                        <span class="x-red"></span>{fun JZLANG('图片宽')}
                    </label>
                    <div class="layui-input-inline">
                        <input type="text"  placeholder="{fun JZLANG('0表示不限制')}" value="{$data['w']}" style="width:500px;" name="w"
                        autocomplete="off" class="layui-input">
                    </div>
                </div>
				
				 <div class="layui-form-item">
                    <label for="url" class="layui-form-label">
                        <span class="x-red"></span>{fun JZLANG('跳转链接')}
                    </label>
                    <div class="layui-input-inline">
                        <input type="text" id="url" value="{$data['url']}" style="width:500px;"  name="url" 
                        autocomplete="off" class="layui-input">
                    </div>
                </div>
				<span id="content_fields"></span>
				<div class="layui-form-item">
                    <label for="orders" class="layui-form-label">
                        <span class="x-red"></span>{fun JZLANG('排序')}
                    </label>
                    <div class="layui-input-inline">
                        <input type="number" id="orders" value="{$data['orders']}" name="orders" 
                        autocomplete="off" class="layui-input">
                    </div>
					 <div class="layui-form-mid layui-word-aux">
					  {fun JZLANG('数字越大越靠前')}
				  </div>
					
                </div>
				<div class="layui-form-item" pane>
                    <label for="isshow" class="layui-form-label">
                        <span class="x-red"></span>{fun JZLANG('是否显示')}
                    </label>
                    <div class="layui-input-inline">
                        <input type="radio" name="isshow" value="0" title="{fun JZLANG('不显示')}" {if($data['isshow']==0)}checked{/if}>
						<input type="radio" name="isshow" value="1" title="{fun JZLANG('显示')}" {if($data['isshow']==1)}checked{/if}>
                    </div>
					 
					
                </div>
				
				 <div class="layui-form-item">
                    <label for="addtime" class="layui-form-label">
                        <span class="x-red"></span>{fun JZLANG('更新时间')}
                    </label>
                    <div class="layui-input-inline">
                      <input class="layui-input" value="{if($data)}{fun date('Y-m-d H:i:s',$data['addtime'])}{else}{fun date('Y-m-d H:i:s')}{/if}" name="addtime" placeholder="{fun JZLANG('选择时间')}" id="LAY_demorange_s">
                    </div>
                   
                </div>
				

				</div>
				<div class="layui-tab-item">
				<span id="ext_fields"></span>
				
				</div>
			  </div>
			</div>
               
                <div class="layui-form-item" style="text-align:center;">
                    
                     <button  class="layui-btn" lay-filter="save" lay-submit="">
                        {fun JZLANG('保存')}
                    </button>
                </div>
            </form>
        </div>
		<br/>
		<br/>
		<br/>
		<br/>
		<br/>
		<br/>
		<br/>
		<br/>
		<br/>
      
        <script>
			{include="fields"}
			function deleteImage(elm){
				$(elm).prev().attr("src", "{__Tpl_style__}/style/images/nopic.jpg");
				$('#litpic').val("");
			}
            layui.use(['laydate','form','layer','upload'], function(){
                $ = layui.jquery;
              var form = layui.form
              ,layer = layui.layer,laydate = layui.laydate;
		
			  laydate.render({
				elem: '#LAY_demorange_s', //指定元素
				type:'datetime'
			  });
			  var upload = layui.upload;
			
              //图片上传接口
              upload.render({
			    elem: '#litpic_upload',
                url: "{fun U('Common/uploads')}" //上传接口
                ,data:{tid:function(){ return $("#tid").val();},molds:'collect'}
                ,done: function(res){ //上传成功后的回调
                 
					if(res.code==0){
						 $('#litpic_img').attr('src',res.url);
						 $('#litpic').val(res.url);
					}else{
						 layer.alert(res.error, {icon: 5});
					}
                 
                }
              });

		  //图库按钮点击事件
		  $("#litpic_gallery").on("click", function(){
			  var galleryLayer = layer.open({
				  type: 1,
				  title: "{fun JZLANG('选择图片')}",
				  area: ["80%", "80%"],
				  content: `<div class="gallery-container" style="padding: 15px;">
					  <div class="gallery-header" style="margin-bottom: 15px;">
						  <div class="layui-btn-group">
							  <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="gallery_prev_litpic">{fun JZLANG('上一页')}</button>
							  <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="gallery_next_litpic">{fun JZLANG('下一页')}</button>
						  </div>
						  <span id="gallery_page_info_litpic" style="margin-left: 15px;"></span>
					  </div>
					  <div id="gallery_list_litpic" class="gallery-list" style="min-height: 400px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
					  <div class="gallery-footer" style="margin-top: 15px; text-align: center;">
						  <button type="button" class="layui-btn" id="gallery_confirm_litpic">{fun JZLANG('确定')}</button>
						  <button type="button" class="layui-btn layui-btn-primary" onclick="layer.closeAll();">{fun JZLANG('取消')}</button>
					  </div>
				  </div>`,
				  success: function(layero, index){
					  var currentPage = 1;
					  var pageSize = 12;
					  var selectedImages = [];
					  var totalCount = 0;
					  
					  function loadGallery(page){
						  $.ajax({
							  url: "{fun U('Sys/pictures')}",
							  type: "GET",
							  data: {ajax: 1, page: page, pageSize: pageSize},
							  dataType: "json",
							  success: function(res){
								  if(res.code == 0){
									  var html = "";
									  if(res.data.length > 0){
										$.each(res.data, function(i, item){
											var ext = item.filetype.split('.').pop().toLowerCase();
											var imageExts = ["jpg", "jpeg", "png", "gif", "bmp", "webp", "svg"];
											var isImage = imageExts.includes(ext);
											var contentHtml = "";
											if(isImage){
												contentHtml = `<img src="${item.litpic}" style="width: 100%; height: 100%; object-fit: cover;">`;
											}else{
												contentHtml = `<div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f5f5f5; padding: 10px;">
													<i class="layui-icon" style="font-size: 40px; color: #999;">&#xe61e;</i>
													<span style="font-size: 12px; color: #666; margin-top: 8px; word-break: break-all; text-align: center;">${item.fileName}</span>
												</div>`;
											}
											
											html += `<div class="gallery-item" data-id="`+item.id+`" data-url="`+item.litpic+`" style="width: 140px; height: 140px; border: 2px solid #e6e6e6; border-radius: 4px; cursor: pointer; position: relative; overflow: hidden;">
												`+contentHtml+
												`<div class="gallery-item-info" style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; padding: 5px; font-size: 12px; display: none;">
													${item.fileName}<br>${item.size}kb
												</div>
												<div class="gallery-item-check" style="position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.5); display: none;">
													<i class="layui-icon" style="color: #fff; font-size: 14px; line-height: 16px;">&#xe605;</i>
												</div>
											</div>`;
										});
										$("#gallery_list_litpic").html(html);
										totalCount = res.count;
										var totalPages = Math.ceil(totalCount / pageSize);
										$("#gallery_page_info_litpic").text("第"+page+"页 / 共"+totalPages+"页");
									
									  $("#gallery_list_litpic .gallery-item").hover(
										  function(){
											  $(this).find(".gallery-item-info").show();
										  },
										  function(){
											  $(this).find(".gallery-item-info").hide();
										  }
									  );
									  
									  $("#gallery_list_litpic .gallery-item").on("click", function(){
										  var url = $(this).data("url");
										  var index = selectedImages.indexOf(url);
									  
										  if(index > -1){
											  selectedImages.splice(index, 1);
											  $(this).css("border-color", "#e6e6e6");
											  $(this).find(".gallery-item-check").hide();
										  }else{
											  selectedImages.push(url);
											  $(this).css("border-color", "#1E9FFF");
											  $(this).find(".gallery-item-check").show();
										  }
									  });
									  
									  $("#gallery_list_litpic .gallery-item").each(function(){
										  var url = $(this).data("url");
										  if(selectedImages.indexOf(url) > -1){
											  $(this).css("border-color", "#1E9FFF");
											  $(this).find(".gallery-item-check").show();
										  }
									  });
								  }else{
									  $("#gallery_list_litpic").html('<div style="width: 100%; text-align: center; padding: 50px; color: #999;">{fun JZLANG('暂无图片')}</div>');
								  }
							  }else{
								  layer.alert(res.msg || "{fun JZLANG('加载失败')}", {icon: 5});
							  }
						  },
						  error: function(){
							  layer.alert("{fun JZLANG('请求失败')}", {icon: 5});
						  }
					  });
				  	  }
				  
						$("#gallery_prev_litpic").on("click", function(){
							if(currentPage > 1){
								currentPage--;
								loadGallery(currentPage);
							}
						});
						
						$("#gallery_next_litpic").on("click", function(){
							var totalPages = Math.ceil(totalCount / pageSize);
							if(currentPage < totalPages){
								currentPage++;
								loadGallery(currentPage);
							}
						});
						
						$("#gallery_confirm_litpic").on("click", function(){
							if(selectedImages.length > 0){
								$("#litpic").val(selectedImages.join(","));
								$("#litpic_img").attr("src", selectedImages[0]);
								layer.closeAll();
							}else{
								layer.alert("{fun JZLANG('请选择至少一张图片')}", {icon: 5});
							}
						});
				  
						loadGallery(currentPage);
			  		}
		  });
		  });
			  
			    //监听提交
              form.on('submit(save)', function(data){
                
				$.post("{fun U('editcollect')}",data.field,function(r){
					var r = JSON.parse(r);
					if(r.code==0){
						 layer.msg(r.msg, {icon: 6,time: 2000},function () {
							{if($webconf['admintpl']=='tpl')}
							window.location.href="{fun U('Collect/index')}";
							{else}
							parent.location.reload();
							{/if}
							
						});
					}else{
						layer.alert(r.msg, {icon: 5});
					}
				});
				
               
                return false;
              });
            get_fields(0,{$data['id']});
            get_fields_ext(0,{$data['id']});
			
           
              
              
            });
        </script>
      
    </body>

</html>
