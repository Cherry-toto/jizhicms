<div class="layui-input-block" style="width:100%;">
		
    <div style="border: 1px solid #ccc;">
       <div id="editor-toolbar-body" style="border-bottom: 1px solid #ccc;"></div>
       <div id="editor-text-area-body" style="height: 350px"></div>
     </div>
     <!-- 显示内容 -->
     <div style="margin-top: 20px;">
        {if($data)}
       <textarea id="editor-content-textarea-body" style="display:none" name="body">{$data['body']}</textarea>
       {else}
       <textarea id="editor-content-textarea-body" style="display:none" name="body"></textarea>
       {/if}
     </div>
     
     <!-- 图库模态框 -->
     <div id="image-library-modal-body" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000;">
       <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80%; height:80%; background:white; border-radius:5px; overflow:hidden;">
         <div style="padding:20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
           <h3>本地图库</h3>
           <button id="close-library-modal-body" type="button" style="padding:5px 15px; background:#f0f0f0; border:none; border-radius:3px; cursor:pointer;">关闭</button>
         </div>
         <div id="image-library-content-body" style="padding:20px; height:calc(100% - 170px); overflow-y:auto;">
           <div id="image-list-body" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:15px;">
             <!-- 图片将通过JS动态加载 -->
           </div>
         </div>
         <div style="padding:15px 20px; border-top:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
           <div id="gallery-page-info-body" style="color:#666; font-size:14px;">第1页 / 共1页</div>
           <div style="display:flex; gap:10px;">
             <button id="gallery-prev-page-body" type="button" style="padding:6px 15px; background:#f0f0f0; border:none; border-radius:3px; cursor:pointer; color:#666;">上一页</button>
             <button id="gallery-next-page-body" type="button" style="padding:6px 15px; background:#f0f0f0; border:none; border-radius:3px; cursor:pointer; color:#666;">下一页</button>
             <button id="insert-selected-images-body" type="button" style="padding:6px 20px; background:#1890ff; color:white; border:none; border-radius:3px; cursor:pointer;">插入选中图片</button>
           </div>
         </div>
       </div>
     </div>

   
   
</div>

<script>
			
           
	$(document).ready(function (){
    var html = document.getElementById("editor-content-textarea-body").value
     var E_body = window.wangEditor
    // 切换语言
    E_body.i18nChangeLanguage("zh-CN")
    window.editor = E_body.createEditor({
      selector: "#editor-text-area-body",
      html: html,
      config: {
        placeholder: "请输入内容...",
        MENU_CONF: {
            uploadImage: {
                fieldName: "file",
                server: "{fun U('common/uploads')}",
                 // 单个文件的最大体积限制，默认为 2M
                maxFileSize: 100 * 1024 * 1024, // 1M
            
                // 最多可上传几个文件，默认为 100
                maxNumberOfFiles: 100,
           
                allowedFileTypes: ["image/*"],
                // 超时时间，默认为 10 秒
                timeout: 10 * 60 * 1000, // 5 秒
                 // 单个文件上传成功之后
                //onSuccess(file: File, res: any) {  // TS 语法
                onSuccess(file, res) {          // JS 语法
                    console.log(`${file.name} 上传成功`, res)
                    if(res.code!=0){
                        alert(res.error)
                    }
                },
            
                // 单个文件上传失败
                //onFailed(file: File, res: any) {   // TS 语法
                onFailed(file, res) {           // JS 语法
                    console.log(`${file.name} 上传失败`, res)
                },
            
                // 上传错误，或者触发 timeout 超时
                //onError(file: File, err: any, res: any) {  // TS 语法
                onError(file, err, res) {               // JS 语法
                    console.log(`${file.name} 上传出错`, err, res)
                },
                //customInsert(res: any, insertFn: InsertFnType) {  // TS 语法
                customInsert(res, insertFn) {                  // JS 语法
                    // res 即服务端的返回结果
                    console.log(res,insertFn)
                    // 从 res 中找到 url alt href ，然后插入图片
                    insertFn(res.url)
                },
          },
            uploadVideo: {
                fieldName: "file",
                server: "{fun U('common/uploads')}",
                 // 单个文件的最大体积限制，默认为 2M
                maxFileSize: 10000 * 1024 * 1024 * 1024, // 1M
            
                // 最多可上传几个文件，默认为 100
                maxNumberOfFiles: 100,
     
                allowedFileTypes: ["video/*"],
                // 超时时间，默认为 10 秒
                timeout: 30 * 60 * 1000, // 5 秒
                 // 单个文件上传成功之后
                //onSuccess(file: File, res: any) {  // TS 语法
                onSuccess(file, res) {          // JS 语法
                    console.log(`${file.name} 上传成功`, res)
                    if(res.code!=0){
                        alert(res.error)
                    }
                },
            
                // 单个文件上传失败
                //onFailed(file: File, res: any) {   // TS 语法
                onFailed(file, res) {           // JS 语法
                    console.log(`${file.name} 上传失败`, res)
                },
            
                // 上传错误，或者触发 timeout 超时
                //onError(file: File, err: any, res: any) {  // TS 语法
                onError(file, err, res) {               // JS 语法
                    console.log(`${file.name} 上传出错`, err, res)
                },
                //customInsert(res: any, insertFn: InsertFnType) {  // TS 语法
                customInsert(res, insertFn) {                  // JS 语法
                    // res 即服务端的返回结果
                    console.log(res,insertFn)
                    // 从 res 中找到 url alt href ，然后插入图片
                    insertFn(res.url)
                },
          },
        },
        onChange(editor) {
          var html = editor.getHtml()
          var num = 0,
            reg = /<p>(&nbsp;|&nbsp;\s+)+<\/p>|<p>(<br>)+<\/p>/g;
            while (num < html.length && html != "")
            {
                num++;
                let k = html.match(reg);
                if (k) {
                html = html.replace(k[0], "");
                }
            } 
          document.getElementById("editor-content-textarea-body").value = html
        }
      }
    })
    class MyMenuBody {
        constructor() {
            this.title = "源码"
            this.tag = "button"
            this.sourceActive = false
        }
        getValue(editor) {
            if (this.sourceActive) {
                return editor.getText()
            } else {
                return editor.getHtml()
            }

        }
        isActive(editor) {
            return this.sourceActive
        }
        isDisabled(editor) {
            return false // or true
        }
        exec(editor, value) {
            this.sourceActive = !this.sourceActive
            editor.clear()
            E_body.SlateTransforms.setNodes(editor, { type: "paragraph" }, { mode: "highest"})
            var num = 0,
            reg = /<p>(&nbsp;|&nbsp;\s+)+<\/p>|<p>(<br>)+<\/p>/g;
            while (num < value.length && value != "")
            {
                num++;
                let k = value.match(reg);
                if (k) {
                    value = value.replace(k[0], "");
                }
            } 
            if (this.isActive()) {
                editor.insertText(value)
            } else {
                editor.dangerouslyInsertHtml(value)
            }



        }
    }
    
    // 图库菜单类
    class MyGalleryMenuBody {
      constructor() {
        this.title = "图库"
        this.tag = "button"
      }
      getValue(editor) {
        return ""
      }
      isActive(editor) {
        return false
      }
      isDisabled(editor) {
        return false
      }
      exec(editor, value) {
        // 显示图库模态框
        document.getElementById("image-library-modal-body").style.display = "block"
        // 加载图片列表
        loadImageLibrary("body")
      }
    }
    
    const myMenuConfBody = {
        key: "bodyhtml",
        factory() {
            return new MyMenuBody()
        }
    }
    
    const myGalleryMenuConfBody = {
        key: "bodygallery",
        factory() {
            return new MyGalleryMenuBody()
        }
    }
    
    E_body.Boot.registerMenu(myMenuConfBody)
    E_body.Boot.registerMenu(myGalleryMenuConfBody)
    window.toolbar = E_body.createToolbar({
        editor,
        selector: "#editor-toolbar-body",
        config: {
            insertKeys: {
                index: 0,
                keys: ["bodyhtml", "bodygallery"],
            }
        }
    })


        
	})
	
	// 加载图片库函数
	var galleryPageBody = 1;
	var galleryPageSizeBody = 20;
	var galleryTotalCountBody = 0;
	
	function loadImageLibrary(fieldRd, page) {
		if(page) galleryPageBody = page;
		var imageList = document.getElementById("image-list-"+fieldRd);
		imageList.innerHTML = `<div style="text-align:center; padding:50px;">加载中...</div>`;
		
		// 模拟加载图片，实际项目中应该从服务器获取已上传的图片列表
		// 这里假设服务器返回JSON格式的图片列表
		$.ajax({
			url: "{fun U('Sys/pictures')}",
			type: "GET",
			data: {ajax:1, page: galleryPageBody, pageSize: galleryPageSizeBody},
			dataType: "json",
			success: function(res) {
				if(res.code == 0 && res.data && res.data.length > 0) {
					imageList.innerHTML = "";
					res.data.forEach(function(image) {
						var imageItem = document.createElement("div");
						imageItem.style.cssText = "position:relative; border:2px solid transparent; cursor:pointer; transition:all 0.3s;";
						imageItem.innerHTML = `
															<div style="position:absolute; top:5px; left:5px; z-index:10;">
																<div class="custom-checkbox" style="width:20px; height:20px; border:2px solid #ccc; border-radius:3px; background:white; display:flex; align-items:center; justify-content:center; cursor:pointer;">
																	<span class="checkmark" style="display:none; color:#1890ff; font-size:14px; font-weight:bold;">✓</span>
																</div>
																<input type="checkbox" style="display:none;" data-src="${image.litpic}">
															</div>
															<img src="${image.litpic}" style="width:100%; height:120px; object-fit:cover; border-radius:3px;">
														`;
						
						// 点击图片切换选中状态
						imageItem.addEventListener("click", function(e) {
							var checkbox = this.querySelector("input[type=\"checkbox\"]");
							var customCheckbox = this.querySelector(".custom-checkbox");
							var checkmark = this.querySelector(".checkmark");
							
							checkbox.checked = !checkbox.checked;
							
							// 更新自定义复选框显示
							if(checkbox.checked) {
								customCheckbox.style.borderColor = "#1890ff";
								customCheckbox.style.backgroundColor = "#1890ff";
								checkmark.style.display = "block";
								checkmark.style.color = "white";
							} else {
								customCheckbox.style.borderColor = "#ccc";
								customCheckbox.style.backgroundColor = "white";
								checkmark.style.display = "none";
							}
							
							// 更新边框样式
							this.style.borderColor = checkbox.checked ? "#1890ff" : "transparent";
						});
						
						imageList.appendChild(imageItem);
					});
					
					// 更新分页信息
					galleryTotalCountBody = res.count;
					var totalPages = Math.ceil(galleryTotalCountBody / galleryPageSizeBody);
					document.getElementById("gallery-page-info-body").textContent = "第"+galleryPageBody+"页 / 共"+totalPages+"页";
					
					// 更新按钮状态
					document.getElementById("gallery-prev-page-body").disabled = galleryPageBody <= 1;
					document.getElementById("gallery-next-page-body").disabled = galleryPageBody >= totalPages;
				} else {
					imageList.innerHTML = "<div style=\"text-align:center; padding:50px;\">暂无图片</div>";
				}
			},
			error: function() {
				imageList.innerHTML = "<div style=\"text-align:center; padding:50px; color:red;\">加载失败</div>";
			}
		});
	}
	
	// 关闭模态框
	document.getElementById("close-library-modal-body").addEventListener("click", function() {
		document.getElementById("image-library-modal-body").style.display = "none";
	});
	
	// 分页控制函数
	document.getElementById("gallery-prev-page-body").addEventListener("click", function() {
		if(galleryPageBody > 1) {
			loadImageLibrary("body", galleryPageBody - 1);
		}
	});
	
	document.getElementById("gallery-next-page-body").addEventListener("click", function() {
		var totalPages = Math.ceil(galleryTotalCountBody / galleryPageSizeBody);
		if(galleryPageBody < totalPages) {
			loadImageLibrary("body", galleryPageBody + 1);
		}
	});
	
	// 插入选中图片
	document.getElementById("insert-selected-images-body").addEventListener("click", function() {
		var selectedCheckboxes = document.querySelectorAll("#image-list-body input[type=\"checkbox\"]:checked");
		var selectedImages = [];
		
		selectedCheckboxes.forEach(function(checkbox) {
			selectedImages.push(checkbox.dataset.src);
		});
		
		if(selectedImages.length > 0) {
			// 插入图片到编辑器
			selectedImages.forEach(function(imageUrl) {
				// 使用 wangEditor 的 API 插入图片
				window.editor.dangerouslyInsertHtml('<img src="' + imageUrl + '" alt="" style="width: 200px;">');
			});
			
			// 关闭模态框
			document.getElementById("image-library-modal-body").style.display = "none";
		} else {
			alert("请先选择要插入的图片");
		}
	});

</script>
